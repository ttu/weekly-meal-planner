# Staging deploy: after `validate` succeeds on a push to main, or by hand.
#
# relay     wrangler deploy of relay/ (Cloudflare Worker, ADR 0013)
# web       export with staging env, then eas deploy (staging alias)
#
# GitHub Environment "staging":
#   variable RELAY_URL (the deployed Worker's URL, public)
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, EXPO_TOKEN.
# Needs `eas init` run once, so app.json carries extra.eas.projectId.

name: deploy-staging

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy --config relay/wrangler.toml --name menami-relay-staging

  web:
    runs-on: ubuntu-latest
    needs: relay
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require a linked EAS project
        run: |
          grep -q '"projectId"' app.json || {
            echo "app.json has no extra.eas.projectId. Run \`eas init\` locally and commit it."
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 24.14.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Export web
        run: pnpm run build
        env:
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL }}
      - name: Deploy to EAS Hosting (staging alias)
        run: eas deploy --alias staging --non-interactive
