# Production deploy: push a version tag (v1.2.3) that is on main, or run by hand
# against a tag.
#
# relay     wrangler deploy of relay/ (Cloudflare Worker, ADR 0013)
# web       export with production env, then eas deploy --prod
#
# GitHub Environment "production" (add a required reviewer):
#   variable RELAY_URL (the deployed Worker's URL, public)
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, EXPO_TOKEN.

name: deploy-production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    environment: production
    # A manual run from a branch must not reach production.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main; production deploys only from main."
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy --config relay/wrangler.toml --name menami-relay

  web:
    runs-on: ubuntu-latest
    needs: relay
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main; production deploys only from main."
            exit 1
          }
      - name: Require a linked EAS project
        run: |
          grep -q '"projectId"' app.json || {
            echo "app.json has no extra.eas.projectId. Run \`eas init\` locally and commit it."
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 24.14.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Require RELAY_URL
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          [ -n "$RELAY_URL" ] || {
            echo "The environment variable RELAY_URL is not set; the app would throw at startup."
            exit 1
          }
      - name: Export web
        run: pnpm run build
        env:
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL }}
      - name: Deploy to EAS Hosting (production)
        run: eas deploy --prod --non-interactive
