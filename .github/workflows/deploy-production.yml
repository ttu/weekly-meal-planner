# Production deploy: push a version tag (v1.2.3) that is on main, or run by hand
# against a tag.
#
# database  supabase db push, then the idempotent catalogue sync
# web       export with production env, then eas deploy --prod
#
# GitHub Environment "production" (add a required reviewer):
#   variable SUPABASE_PROJECT_REF
#   secrets  SUPABASE_DB_PASSWORD, SUPABASE_SERVICE_ROLE_KEY,
#            EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
# Repository secrets: SUPABASE_ACCESS_TOKEN, EXPO_TOKEN.

name: deploy-production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    environment: production
    # A manual run from a branch must not reach production.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the release commit to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_SHA is not on main. Tag a commit that has been merged."
            exit 1
          }
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync the Catalogue
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run catalogue:sync

  web:
    runs-on: ubuntu-latest
    needs: database
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a linked EAS project
        run: |
          grep -q '"projectId"' app.json || {
            echo "app.json has no extra.eas.projectId. Run \`eas init\` locally and commit it."
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 24.14.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Export web
        run: pnpm run build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to EAS Hosting (production)
        run: eas deploy --prod --non-interactive
