name: validate

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # One failing gate must not hide the others: you want every problem from
      # one push, not one problem per push.
      fail-fast: false
      matrix:
        step:
          - format:check
          - lint
          - lint:boundaries
          - lint:duplication
          - type-check
          - test
          - build
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA:
      # a tag is mutable, so `@v4` is an unreviewed dependency that can change
      # under us. The trailing comment records which release each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.step }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-${{ matrix.step }}
          path: |
            coverage/
            .jscpd/
          if-no-files-found: ignore

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
