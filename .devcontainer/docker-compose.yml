services:
  app:
    # Pinned to match @playwright/test in package.json, so the browsers in the
    # image are the ones the tests expect. Bump both together.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    volumes:
      - ..:/workspaces/weekly-meal-planner:cached
      # node_modules on a native volume, not the macOS bind mount: install
      # churn triggers ESTALE / ENOTEMPTY on VirtioFS.
      - node-modules:/workspaces/weekly-meal-planner/node_modules
      - playwright-browsers:/ms-playwright
      # pnpm's content store. Left alone, pnpm puts it at the root of the
      # project's filesystem — the bind mount — and 900MB lands in the host
      # checkout. See npm_config_store_dir in devcontainer.json.
      - pnpm-store:/home/ubuntu/.pnpm-store
      # --- git worktree support (paths written by initialize.sh) ---
      # Each at its original host path, so the absolute paths git records (the
      # worktree's `gitdir:`, the admin dir's back-pointer) resolve inside the
      # container. Without the back-pointer target git marks the worktree
      # prunable, and a `git gc` would delete its admin dir on the host too.
      - ${LOCAL_WORKSPACE_FOLDER:?run .devcontainer/initialize.sh}:${LOCAL_WORKSPACE_FOLDER}
      # The shared .git, read-only: its config, hooks and the other worktrees'
      # admin dirs decide what host git runs, so the container may not write
      # them. Writable are only what commits, fetches and pushes touch —
      # objects, refs, reflogs — and this worktree's own admin dir (HEAD,
      # index), minus the two files in it that point git elsewhere.
      - ${GIT_COMMON_DIR:?run .devcontainer/initialize.sh}:${GIT_COMMON_DIR}:ro
      - ${GIT_COMMON_DIR}/objects:${GIT_COMMON_DIR}/objects
      - ${GIT_COMMON_DIR}/refs:${GIT_COMMON_DIR}/refs
      - ${GIT_COMMON_DIR}/logs:${GIT_COMMON_DIR}/logs
      - ${GIT_WORKTREE_ADMIN:?run .devcontainer/initialize.sh}:${GIT_WORKTREE_ADMIN}
      - ${GIT_WORKTREE_ADMIN}/commondir:${GIT_WORKTREE_ADMIN}/commondir:ro
      - ${GIT_WORKTREE_ADMIN}/gitdir:${GIT_WORKTREE_ADMIN}/gitdir:ro
      # The worktree's `.git` file points at the admin dir: read-only at both
      # workspace paths. So is .husky — core.hooksPath points into it, and its
      # hooks run on the host's next commit.
      - ../.git:/workspaces/weekly-meal-planner/.git:ro
      - ${LOCAL_WORKSPACE_FOLDER}/.git:${LOCAL_WORKSPACE_FOLDER}/.git:ro
      - ../.husky:/workspaces/weekly-meal-planner/.husky:ro
      - ${LOCAL_WORKSPACE_FOLDER}/.husky:${LOCAL_WORKSPACE_FOLDER}/.husky:ro
    # Host commit identity, captured by initialize.sh into .env.
    environment:
      - HOST_GIT_USER_NAME=${HOST_GIT_USER_NAME:-}
      - HOST_GIT_USER_EMAIL=${HOST_GIT_USER_EMAIL:-}
      # The workspace's host path, which git must also be told to trust.
      - LOCAL_WORKSPACE_FOLDER=${LOCAL_WORKSPACE_FOLDER:-}
    # Local Supabase runs on the host (`supabase start`); scripts in the
    # container reach it as host.docker.internal. Docker Desktop provides the
    # name already; this line makes Linux hosts match.
    extra_hosts:
      - host.docker.internal:host-gateway
    command: sleep infinity
    # Chromium hard-crashes on Docker's default 64MB /dev/shm.
    shm_size: '1gb'

volumes:
  # Per-worktree: branches diverge in dependencies.
  node-modules:
  # Per-container cache; survives rebuilds.
  pnpm-store:
  # Shared across every container for this repo. Created by initialize.sh.
  playwright-browsers:
    external: true
    name: menami-playwright-browsers
